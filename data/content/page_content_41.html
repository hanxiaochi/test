															}

														{

																	data, type,
																	full, meta) {
																var totalPrice = new Number(
																		data)

																return parseFloat(totalPrice);

														{
															targets : 0,

																	data, type,
																	full, meta) {

																	$(full)
																			.css(
																					'color',
																					'#A9A9A9')
																}
																var gatherName = "第"
																		+ data
																		+ "期";
																return gatherName;
															}
														} ]
											});

							projectPlanDate.on('click',
									'.btn-group[data-id] button[data-type]',
									function(e, settings, json) {
										sysSectionLineClick[$(this).attr(
												"data-type")]($(this).parent()
												.attr("data-id"), $(this).attr(
												"data-gatherState"), this);//监听 操作按钮
									});
							var sysSectionLineClick = {
								edit : function(planId) {
									Ewin.modal({
										width : 400,
										modalId : "planDataEdit",
										title : "编辑范本",
										url : "secProjectPlan/plan_edit_page",
										data : {
											"planId" : planId,
										}
									});
								},
								remove : function(planId) {
									Ewin
											.confirm({
												message : "确认要删除选择的数据吗？"
											})
											.on(
													function(e) {
														if (e) {//e 为true 说明点击确定
															$
																	.ajax({
																		url : "secProjectPlan/delete_plan",
																		type : "get",
																		data : {
																			"planId" : planId
																		},
																		dataType : "json",
																		success : function(
																				result) {
																			if (result.code == 1) {
																				Ewin
																						.msg({
																							type : "success",

																						});

																						.DataTable();
																				projectPlanDate.ajax
																						.reload(
																								null,
																								false);
																			} else {
																				Ewin
																						.msg({
																							type : "danger",

																			}

		$(document).ready(function() {
			jeDate('#startDate', {
				format : "YYYY-MM-DD"
			});
			jeDate('#endDate', {
				format : "YYYY-MM-DD"
			});
		});

		//生成计划
		$("#createProjectPlan").on(
				"click",
				function() {
					if($("#sysSectionWorkPositionSel>option").length==0 ||$("#sysSectionWorkPositionSel").find("option[value='0']").length==1){
						Ewin.msg({type:"danger",content:"请选择工作位置！"})
						return false;
					}
					Ewin.confirm({message : "重新生成将替换原有数据，确认要重新生成吗？"}).on(
						function(e) {if (e) {//e 为true 说明点击确定
							$.ajax({
								url : "secProjectPlan/create_project_plan",
								type : "get",
								data : {
									"startDate" : $("#startDate").val(),
									"endDate" : $("#endDate").val()
								},
								dataType : "json",
								success : function(result) {
									if (result.code == 1) {
										Ewin.msg({
											type : "success",
											content : "生成成功"
										});
										var projectPlanDate = $('#projectPlanList')
												.DataTable();
										projectPlanDate.ajax.reload(null, false);
									} else {
										Ewin.msg({
											type : "danger",
											content : result.msg
										})
									}
								}
							});

							return;
							}
						});
				});

		$("#addProjectPlan").click(function() {
			var projectPlanDate = $('#projectPlanList').DataTable();
			var info = projectPlanDate.page.info();
			var dataRows = info.recordsTotal;
			if (dataRows == 0) {
				Ewin.msg({
					type : "danger",
					content : "请先生成计划"
				});
				return;
			}
			Ewin.modal({
				width : 400,
				modalId : "planDataEdit",
				title : "编辑范本",
				url : "secProjectPlan/plan_edit_page",
				data : {

				}
			});
		})

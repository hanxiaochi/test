	<script type="text/html" id="indexTabContent">
		<div class="box" style="margin-bottom: 0px;height:50%;border: none;">
					<div class="box-body">
						<form class="layui-form layui-form-pane" action=""  style="margin:5px 10px">
							<div class="layui-inline">
								<select  lay-filter="select" id="select">
									<option  value="true" >全部</option>
									<option  value="false" >待审核</option>
									</select>
								</div>
						</form>
						<input type="hidden" id="billMeasureTableSelectId">
						<table id="manualMeasureTable" lay-filter="manualMeasureTable"></table>
				   	</div>
		</div>

	<script type="text/javascript" src="js/bootstrap-zwtab.js"></script>
	<script >
	var moneyNum = getValue("moneyDecimals");
		$("#measureTab").html($("#indexTabContent").html());
		layui.use([ 'layer', 'table','form' ], function() {
			var pageNum = 1;
			var table = layui.table;
			var layer = layui.layer,form = layui.form;
			form.render();
			form.on('select(select)', function(data){
				//var typeCode =""; 
				table.reload("manualMeasureTable", {where:{
					typeCode:"",
					flag:data.value
				}});
		    })
			var msg = "";
			if(msg!=""){
				layer.msg(msg, {icon: 5,offset: '200px' });
			}
			$.ajax({
				type : 'get',
				url : "manualMeasure/detail_columns",
				dataType : 'json',
				success : function(res) {
					if(res.code==1){
							table.render({
								elem: '#manualMeasureTable',
								size: 'sm',
								height: 'full-300',
								url:'manualMeasure/detail_list?typeCode=',
								toolbar: '#manualMeasureTableToolBar',
								defaultToolbar:[],
								cols:res.data,
								where:{sectionType:"0"},
								even:true,
								cellMinWidth : 80,
								page: {
									limit: 10,
							  		curr: 1
							  	}
								,done : function(res, curr, count) {
							    	pageNum = curr;
								}
							});
							table.on('tool(manualMeasureTable)', function(obj){
								var data = obj.data;
								manualMeasureTableClick[obj.event](data.manualId,obj);
							});
							table.on('row(manualMeasureTable)', function(obj){
// 								obj.tr.addClass('layui-table-click').siblings().removeClass('layui-table-click');
							})
							table.on('toolbar(manualMeasureTable)', function(obj){
								if($("#sysGatherDataWorkPositionSel>").length==0 || $("#select2-sysGatherDataWorkPositionSel-container").attr("title")=="请选择工期"){
									Ewin.msg({type:"danger",content:"请选择工作位置！"})
									return false;
								}
								var checkStatus = table.checkStatus(obj.config.id),data = checkStatus.data;
								manualMeasureTableToolClick[obj.event](data);
							});
							$("#refresh").on("click",function(){
								table.reload('manualMeasureTable', {where: {sectionType: $("#sectionType").val()}});
							})
					}else{
						layer.msg(res.msg);
					}
				}
			});
			table.on('checkbox(manualMeasureTable)', function(obj){
				if(obj.type!='all'){
					if(obj.checked){
						 obj.tr.addClass('layui-table-click'); 	
					}else{
						 obj.tr.removeClass('layui-table-click'); 	
					}
				}else{
					if(obj.checked){
						$("div[class='layui-unselect layui-form-checkbox']").attr('class','layui-unselect layui-form-checkbox layui-form-checked');
						$("div[lay-id='manualMeasureTable'] div[class='layui-table-fixed layui-table-fixed-l'] tr").addClass('layui-table-click ');
						$("div[lay-id='manualMeasureTable'] div[class='layui-table-body layui-table-main'] tr").addClass('layui-table-click ');
					}else{
						 $("div[class='layui-unselect layui-form-checkbox layui-form-checked']").attr('class','layui-unselect layui-form-checkbox');
						$("div[lay-id='manualMeasureTable'] div[class='layui-table-fixed layui-table-fixed-l'] tr").removeClass('layui-table-click ');
						$("div[lay-id='manualMeasureTable'] div[class='layui-table-body layui-table-main'] tr").removeClass('layui-table-click ');
					}
				}
				
			})
			var manualMeasureTableToolClick={
					addmanualMeasure:function(data){
						Ewin.modal({
							width : 700,
							modalId : "manualMeasureEdit",
							async : false,
							title : "添加手动计量",
							url : "manualMeasure/manualMeasure_edit_page",
							data : {type:"edit"},
							drag : true
						});
					},
					reportMeasure:function(data){
					    var message="确认要操作选择的清单吗?";
					    var manualIds="*";
						if(data.length==0){
							message="确认要全部执行吗?";
						}else{
							var arr=new Array();
					    	for(var i=0;i<data.length;i++){
					    		arr.push(data[i].manualId);
					    	}
					    	manualIds = arr.join(",");
						}
						Ewin.confirm({message : message}).on(function(e) {
							if (e) {//e 为true 说明点击确定
								$.ajax({
									url : "manualMeasure/up_order",
									type : "post",
									data : {
										"manualMeasureIds" : manualIds
									},
									dataType : "json",
									success : function(
											result) {
										if (result.code == 1) {
											Ewin.msg({type : "success",content : "操作完成！"})
												Ewin.modal({
												width : 400,
												modalId : "workflowSendSMSpage",
												async : false,
												title : "发送通知",
												url : "workflow/isSendSMSpage",
												data : {
												"pageType" : "manualMeasure",
												"pageNum":1 
												},
												drag : true
												});
											$("#refresh").click();
										} else {
											Ewin.msg({type : "danger",content : result.msg})
										}
									}
								});
							}
						});
					},
					deleteManualMeasure:function(data){
						var checkBoxArr = [];
						var isDelete=false;
						if(data.length==0){
							Ewin.msg({type : "warning",content : "请选择要删除的数据！"});
							return false;
						}else{
							var arr=new Array();
					    	for(var i=0;i<data.length;i++){
					    		arr.push(data[i].manualId);
					    	}
					    	manualIds = arr.join(",");
					    	isDelete=true;
						}
						if(isDelete){
							Ewin.confirm({message : "确认要删除数据吗"}).on(function(e) {
								if (e) {//e 为true 说明点击确定
									$.ajax({
										url : "manualMeasure/delete/" + manualIds,
										type : "delete",
										dataType : "json",
										success : function(result) {
											if (result.code == 1) {
												Ewin.msg({type : "success",content : "已删除"});
												$("#refresh").click();
											} else {
												Ewin.msg({type : "danger",content : result.msg});
											}
										}
									});
								}

							});
						}
					},
					withdrawMeasure : function(data) {//撤回计量单
						var message = "确认要操作选择的清单吗?";
						var manualIds = "*";
						if (data.length == 0) {
							message = "确认要全部执行吗?";
						} else {
							var arr = new Array();
							for (var i = 0; i < data.length; i++) {
								arr.push(data[i].manualId);
							}
							manualIds = arr.join(",");
						}
						 
						Ewin
							.confirm({
								message : message
							})
							.on(
									function(e) {
										if (e) {
							
							$.ajax({
									url : "workflow/withdraw_order",
									type : "post",
									data : {
										"ids" : manualIds,
										"measureType":"ManualMeasure"
									},
									dataType : "json",
									success : function(result) {
										if (result.code == 1) {
										Ewin.msg({
												type : "success",
												content : "操作完成！"
												})
											table.reload("manualMeasureTable");
										} else {
											Ewin.msg({
												type : "warning",
												content : result.msg
												})
										}
										}
										});
								}
								});
								
					},
					agreeMeasure:function(data){
					    var message="确认要同意所选清单吗?";
					    var manualIds="*";
						if(data.length==0){
							message="确认要全部同意吗?";
						}else{
							var arr=new Array();
					    	for(var i=0;i<data.length;i++){
					    		arr.push(data[i].manualId);
					    	}
					    	manualIds = arr.join(",");
						}
						Ewin.confirm({message : message}).on(function(e) {
							if (e) {//e 为true 说明点击确定
								$.ajax({
									url : "manualMeasure/update_measure_state",
									type : "post",
									data : {
										"manualMeasureIds" : manualIds
									},
									dataType : "json",
									success : function(result) {
										if (result.code == 1) {
											Ewin.msg({
												type : "success",
												content : "同意完成！"
											})
											$("#refresh").click();
										} else {
											Ewin.msg({
												type : "danger",
												content : result.msg
											})
										}
									}
								});
							}
						});
					},
					adjustMeasure : function(data) {//调整计量单
						if (data.length == 0) {
							Ewin.msg({
								type : "danger",
								content : "请至少选中一条计量单！"
							})
						} else if (data.length > 15) {
							Ewin.msg({
								type : "danger",
								content : "只能调整15条计量单！"
							});
						} else {
							var arr = new Array();
							for (var i = 0; i < data.length; i++) {
								arr.push(data[i].manualId);
							}
							Ewin.modal({
								title : "调整清单",
								modalId : "adjustPage",
								width : 400,
								url : "manualMeasure/adjust_page",
								data : {
									"manualIds" : arr
											.join(",")
								},
								headerClass : "zw-track-header",
								btn : "hide",
								drag : true
							});
						}
					},
					archive:function(data){
					    var message="确认要归档所选清单吗?";
					    var manualIds="*";
						if(data.length==0){
							message="确认要全部归档吗?";
						}else{
							var arr=new Array();
					    	for(var i=0;i<data.length;i++){
					    		arr.push(data[i].manualId);
					    	}
					    	manualIds = arr.join(",");
						}
						Ewin.confirm({
							message : message
						}).on(function(e) {
							if (e) {//e 为true 说明点击确定
								$.ajax({
									url : "manualMeasure/archive",
									type : "post",
									data : {
										"manualMeasureIds" : manualIds
									},
									dataType : "json",
									success : function(result) {
										if (result.code == 1) {
											Ewin.msg({
												type : "success",
												content : "归档完成！"
											})
											$("#refresh").click();
										} else {
											Ewin.msg({
												type : "danger",
												content : result.msg
											})
										}
									}
								});
							}
						});
					},
			}
			
			var manualMeasureTableClick = {
					measureNo:function(manualMeasureId,obj){
						 $("div[lay-id='manualMeasureTable'] input[type='checkbox']").prop('checked',false);
						 $("div[class='layui-unselect layui-form-checkbox layui-form-checked']").attr('class','layui-unselect layui-form-checkbox');
						 
						$(obj.tr).find("td:first").children().find("div:first").addClass("layui-form-checked");
						var index=$(obj.tr).attr("data-index");
						var data=table.cache["manualMeasureTable"];
						for(var i=0;i<data.length;i++){
							data[i]['LAY_CHECKED']='';
							if(index==i){
								data[i]['LAY_CHECKED']='True';
							}
						}
					},
					reportBtn : function(manualMeasureId,obj) {//上报
						Ewin.confirm({
							message : "确认要上报吗"
						}).on(function(e) {
							if (e) {//e 为true 说明点击确定
								$.ajax({
									url : "manualMeasure/up_order",
									type : "post",
									data : {
										"manualMeasureIds" : manualMeasureId
									},
									dataType : "json",
									success : function(result) {
										if (result.code == 1) {
											Ewin.msg({
												type : "success",
												content : "上报完成！"
											})
											$("#refresh").click();
										} else {
											Ewin.msg({
												type : "danger",
												content : result.msg
											})
										}
									}
								});
							}
						});
					},
					trackBtn : function(manualMeasureId,obj) {//追踪
						Ewin.modal({
							title : "追踪清单",
							modalId : "sysMeterailInRecord",
							width : 650,
							url : "manualMeasure/record_page",
							data : {
								"manualMeasureId" : manualMeasureId
							},
							headerClass : "zw-track-header",
							btn : "hide",
							drag : false
						});
					},
					agreeBtn : function(manualMeasureId,obj) {//同意
						Ewin.confirm({
							message : "确定同意此条清单？"
						}).on(function(e) {
							if (e) {//e 为true 说明点击确定
								$.ajax({
									url : "manualMeasure/update_measure_state",
									type : "post",
									data : {
										"manualMeasureIds" : manualMeasureId
									},
									dataType : "json",
									success : function(result) {
										if (result.code == 1) {
											Ewin.msg({
												type : "success",
												content : "同意完成！"
											})
											$("#refresh").click();
										} else {
											Ewin.msg({
												type : "danger",
												content : result.msg
											})
										}
									}
								});
							}
						});
					},
					editBtn : function(manualMeasureId,obj) {//编辑
						Ewin.modal({
							width : 700,
							modalId : "manualMeasureEdit",
							async : false,
							title : "添加手动计量",
							url : "manualMeasure/manualMeasure_edit_page",
							data : {
								"manualMeasureId" : manualMeasureId,
								type:"edit"
							},
							drag : true
						});
					},returnBtn : function(manualMeasureId, obj) {//退回
						Ewin.modal({
							modalId : "returnOrderPageList",
							title : "退回",
							width : 300,
							headerClass : "zw-track-header",
							submitText : "确认退回",
							url : "manualMeasure/return_order_page",
							data : {
								"billMeasureId" : billMeasureId,
								"tableId" : "billMeasureTable"
							}
						});
					},
					approveBtn : function(manualMeasureId,obj) {
						$.ajax({
							url : "manualMeasure/manualMeasure_edit_page",
							type : "get",
							async : false,
							data : {
								manualMeasureId : manualMeasureId,
								type : "approve",
								pageNum : pageNum
							},
							success : function(result) {
								$("#measureTab").html(result);
							}
						});
					},

					returnBtn : function(manualMeasureId,obj) {//退回
						Ewin.modal({
							modalId : "returnOrderPageList",
							title : "退回",
							width : 300,
							headerClass : "zw-track-header",
							submitText : "确认退回",
							url : "manualMeasure/return_order_page",
							data : {
								"manualMeasureId" : manualMeasureId,
								"tableId" : "manualMeasureTable" //传递本页面表格使用的id 用于退回后的刷新
							}
						});

					},
					deleteBtn : function(manualMeasureId,obj) {//删除
						Ewin.confirm({
							message : "确认要删除选择的数据吗？"
						}).on(function(e) {
							if (e) {//e 为true 说明点击确定
								$.ajax({
									url : "manualMeasure/delete/" + manualMeasureId,
									type : "delete",
									dataType : "json",
									success : function(result) {
										if (result.code == 1) {
											Ewin.msg({
												type : "success",
												content : "已删除"
											});
											$("#refresh").click();
										} else {
											Ewin.msg({
												type : "danger",
												content : result.msg
											});
										}
									}
								});
								return;
							}
						});
					},
					see : function(manualMeasureId,obj) {//浏览
						Ewin.modal({
							modalId : "manualMeasureEdit",
							title : "手动计量清单浏览",
							width : 550,
							url : "manualMeasure/manualMeasure_edit_page",
							data : {
								"manualMeasureId" : manualMeasureId,
								"type" : "see"
							},
							headerClass : "zw-track-header",
							btn : "hide",
						});
					}
				};
			
			
			
		})
		
		

	</script>
</body>
</html>

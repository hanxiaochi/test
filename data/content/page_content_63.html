<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>计量报表显示页面</title>
    <link rel="stylesheet" href="/assets/zTree/css/zTreeStyle.css">
    <style type="text/css">
        /**2020年4月1日 重新将报表页面进行排版，js代码未做修改 -gk*/
        .zwreport-content {
            height: calc(100% - 50px);
        }

        .zwreport-left {
            float: left;
            width: 335px;
            height: 100%;
            overflow: auto;
        }

        .zwreport-right {
            background-color: #404040;
            float: left;
            width: calc(100% - 335px);
            height: 100%;
        }

        #reportManagerIframeView {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .ztree * {
            font-size: 14px;
        }

        .ztree li {
            margin-top: 10px;
        }


        .ztree li a:hover {
            text-decoration: none
        }

        .ztree li a.curSelectedNode {
            background-color: #eeeeee;
            color: #3c8dbc;
            border: none;
            opacity: 1;
        }

        .ztree li span {
            margin-left: 5px;
        }
        #zTreeOnRight {
            position:absolute;
            visibility:hidden;
            top:0;
            background-color: #efecec;
            text-align: center;
        }
        tr:hover{
            cursor: pointer;
            color: #3c8dbc;
            background-color: #d5d3d3;
        }
        tr{
            height: 25px;
        }
        .zw-report-right-menu{
            background-color: #f8f8f8;
            border: 1px solid #dddddd;
            box-shadow: 0 0 2px #333333;
        }
        .zw-report-right-menu .zw-menu-item{
            height: 30px;
            line-height: 30px;
            width: 70px;
            text-align: center;
            color: #666666;
            cursor: pointer;
        }
        .zw-report-right-menu .zw-menu-item:hover{
            background-color: #dddddd;
        }
        .zw-report-right-menu .zw-menu-item:first-child{
            border-bottom: 1px solid #dddddd;
        }
    </style>
</head>
<body>
<!-- 头部 -->
<div class="media box" id="mediaDivId" style="margin:5px;">
    <div class="pull-left">
        <button type="button" style="margin-left: 10px;" class="btn btn-primary"
                id="dataCollectBtn"><i class="fa fa-fw fa-bar-chart-o"></i><span id="dataCollentSpan">数据汇总</span>
        </button>
        <button type="button" style="margin-left: 10px;" class="btn btn-primary"
                id="refreshBtn"><span id="refreshSpan">刷新</span>
        </button>
        <input type="hidden" value="0" id="gatherStateId">
    </div>
    <div class="pull-right" style="margin-right: 2%;">
        <select id="varyConSel" class="reportSelect" style="display:inline;">
            <option value="all">全部计量</option>
            <option value=contract>合同计量</option>
            <option value="vary">变更计量</option>
        </select>
        <select id="measureSel" class="reportSelect" style="display:inline;">
            <option value="all">所有计量</option>
            <option value="current">当期计量</option>
        </select>
        <select id="chapterSel" class="reportSelect" style="display:inline;">
            <option value="all">所有章节</option>
            <option value="100">100章</option>
            <option value="200">200章</option>
            <option value="300">300章</option>
            <option value="400">400章</option>
            <option value="500">500章</option>
            <option value="600">600章</option>
            <option value="700">700章</option>
            <option value="800">800章</option>
            <option value="900">900章</option>
            <option value="1000">1000章</option>
        </select>
    </div>
</div>
<!-- 内容区 -->
<div class="zwreport-content">
    <!-- 左边部分 -->
    <div class="zwreport-left">
        <div id="reportManagerDiv">
            <ul id="treeDemo" class="ztree"></ul>
		</div>
    </div>
    <!-- 右边部分 -->
    <div class="zwreport-right">
        <div id="reportManagerIframeView"></div>
    </div>
</div>
<div hidden id="zTreeOnRight">
    <div class="zw-report-right-menu">
        <div class="zw-menu-item" id="replace">更新</div>
        <div class="zw-menu-item" id="detail">详情</div>
    </div>
</div>
<script src="/assets/zTree/jquery.ztree.all.min.js"
        type="text/javascript"></script>
<script type="text/javascript">
	
	$(function(){
		$.ajax({
            url: "dataGather/data_check_gather",
            data: {},
            dataType: "json",
            success: function (result) {
                if (result.code == 0){
                	Ewin.msg({
                        type: "success",
                        content: result.msg
                    });
                }
            }
        });		
	})

    layui.use(['layer','form', 'jquery'], function () {
        var $ = layui.$, layer = layui.layer, tree, rpId, isDateCollectVal = 1,form = layui.form;
        var msg = "";
        if (msg != "") {
            layer.msg(msg, {icon: 5, offset: '200px'});
            return false;
        }

        /*选中部门节点时触发方法*/
        function onNodeSelect(event, treeId, treeNode) {
            var li=$("#"+treeNode.tId).siblings()
            for (let i = 0; i < li.length; i++) {
                $(li[i].childNodes[1]).removeClass("curSelectedNode")
            }
            $($("#"+treeNode.tId)[0].childNodes[1]).addClass("curSelectedNode")
            var sId=treeNode.rpId
            if (sId == "-1") {
                return false;
            }
            if (isDateCollectVal == 0) {
                Ewin.msg({
                    type: "warning",
                    content: "数据正在汇总！"
                });
                return false;
            }
            rpId = sId;
            var type = treeNode.queryModeType
            $("#chapterSel").val("all");
            $("#measureSel").val("all");
            $("#varyConSel").val("all");
            var chapterSelVal = $("#chapterSel").val();
            var measureSelVal = $("#measureSel").val();
            var varyConSelVal = $("#varyConSel").val();
            var u = "reportManager/reportView?rpId=" + sId;
            iframeUrl = u;
            u += "&chapterType=" + chapterSelVal + "&measureType="
                + measureSelVal + "&varyConType=" + varyConSelVal;
            $("#mediaDivId select").each(function () {
                $(this).attr("style", "display:none");
            });
            if (type == "1") {
                $('#varyConSel').attr("style", "display:inline");
            } else if (type == "2") {
                $('#varyConSel').attr("style", "display:inline");
                $('#measureSel').attr("style", "display:inline");
            } else if (type == "3") {
                $('#varyConSel').attr("style", "display:inline");
                $('#chapterSel').attr("style", "display:inline");
            } else if (type == "4") {
                $('#varyConSel').attr("style", "display:inline");
                $('#measureSel').attr("style", "display:inline");
                $('#chapterSel').attr("style", "display:inline");
            } else if (type == "5") {
                $('#measureSel').attr("style", "display:inline");
            } else if (type == "6") {
                $('#measureSel').attr("style", "display:inline");
                $('#chapterSel').attr("style", "display:inline");
            } else if (type == "7") {
                $('#chapterSel').attr("style", "display:inline");
            }
			var index = layer.load(1); //换了种风格
			
			// 创建 XMLHttpRequest 对象
			        const xhr = new XMLHttpRequest();
			        xhr.open('GET', u, true); // 发起 GET 请求
			        xhr.responseType = 'blob';  // 设置响应类型为 Blob

			        // 设置加载完成后的回调函数
			        xhr.onload = function () {
			            if (xhr.status === 200) {
			                // 确保响应类型是 PDF
			                const contentType = xhr.getResponseHeader('Content-Type');
			                if (contentType === 'application/pdf') {
			                    // 创建 Blob URL
			                    const pdfUrl = URL.createObjectURL(xhr.response);

			                    // 使用 PDFObject 插入 PDF
			                    PDFObject.embed(pdfUrl, "#reportManagerIframeView");

			                    // 隐藏加载状态
			                    layer.close(index);
			                } else {
								Ewin.msg({
									 type: "warning",
									 content: "加载失败，请稍后重试！"
								});
			                    layer.close(index);
			                }
			            } else {
			                // 请求失败，显示错误提示
							Ewin.msg({
							 type: "warning",
							 content: "加载失败，请稍后重试！"
							});
			                layer.close(index);
			            }
			        };

			        // 设置请求出错时的回调函数
			        xhr.onerror = function () {
						Ewin.msg({
						 type: "warning",
						 content: "请求失败，请检查网络连接！"
						});
			            layer.close(index);
			        };

			        // 发送请求
			        xhr.send();
			    
			     
			
            //PDFObject.embed(u, "#reportManagerIframeView");
        }

        function zTreeBeforeRightClick(treeId, treeNode) {
            if(treeNode.rpId==-1){
                return false;
            }
            return true;
        };

        var zTreeOnRightTreeNode
        function zTreeOnRightClick(event, treeId, treeNode) {
            var li=$("#"+treeNode.tId).siblings()
            for (let i = 0; i < li.length; i++) {
                $(li[i].childNodes[1]).removeClass("curSelectedNode")
            }
            $($("#"+treeNode.tId)[0].childNodes[1]).addClass("curSelectedNode")

            var x=event.clientX-180,
                y=event.clientY-40
            $("#zTreeOnRight").css({"top":y+"px", "left":x+"px", "visibility":"visible"})
            $("#zTreeOnRight").show();
            zTreeOnRightTreeNode=treeNode
        };

        $(document).on("click", function () { //对document绑定一个影藏Div方法
            $("#zTreeOnRight").hide();
        });
        if("0"==1){
            $($("tr td")[1]).show();
        }else{
            $($("tr td")[1]).hide();
        }

        $("#replace").on("click", function () {
            var sId=zTreeOnRightTreeNode.rpId
            if (sId == "-1") {
                return false;
            }
            if (isDateCollectVal == 0) {
                Ewin.msg({
                    type: "warning",
                    content: "数据正在汇总！"
                });
                return false;
            }
            rpId = sId;

            var u = "reportManager/reportView?rpId=" + sId;
            iframeUrl = u;
            u += "&chapterType=all&measureType=all&varyConType=all&type=replace";
            var index = layer.load(1); //换了种风格
            $.ajax({
                url:u,
                type:'get',
                success:function () {
                    layer.close(index);
                    layer.msg("更新成功");
                },error:function(xhr, status, error) {
					layer.close(index);
					layer.msg("更新失败");
				}
            })
        });

        $("#detail").on("click", function () {
            $.ajax({
                url: "/reportManager/reoirtMangerDetail",
                type: "get",
                success: function (res) {
                    layer.open({
                        title: '报表详情'
                        ,type: 1
                        ,area: ['500px', '500px']
                        ,shadeClose: true
                        ,btn: ["确认"]
                        ,content: res
                        ,success: function (){
                            //给表单赋值
                            form.val("formTest", { //formTest 即 class="layui-form" 所在元素属性 lay-filter="" 对应的值
                                "reportName": zTreeOnRightTreeNode.reportName // "name": "value"
                                ,"reportNo": zTreeOnRightTreeNode.reportNo
                                ,"reportCode": zTreeOnRightTreeNode.reportCode
                                ,"reportTitle": zTreeOnRightTreeNode.reportTitle
                                //,"signParam": zTreeOnRightTreeNode.signParam
                            });
                            $("#signParam").html(zTreeOnRightTreeNode.signParam);
                        }
                    })
                }
            })

        });

		ztree()
        /*加载左侧部门节点*/
		function ztree() {
			var settingss = {
				data: {
					simpleData: {
						//enable: true,  //true 、 false 分别表示 使用 、 不使用 简单数据模式
						idKey: "rpId",  //节点数据中保存唯一标识的属性名称
						//pIdKey: "parentId",    //节点数据中保存其父节点唯一标识的属性名称
						//rootPId: -1  //用于修正根节点父节点数据，即 pIdKey 指定的属性值
					},
					key: {
						name: "reportName"  //zTree 节点数据保存节点名称的属性名称  默认值："name"
					}
				},
				callback:{
                    onClick:onNodeSelect,
                    beforeRightClick:zTreeBeforeRightClick,
                    onRightClick:zTreeOnRightClick
                }
			};

			$.ajax({
				url: "reportManager/report_project_list",
				data: {
					bdCode: "MEASUREREOPORT"
				},
				dataType: "json",
				success: function (result) {
					if (result.code == 1) {
						var zNodes=result.data
                        zNodes.icon="img/dept.png"
                        for (let i = 0; i < zNodes.children.length; i++) {
                            zNodes.children[i].icon="img/dept.png"
                        }
						zTreeObj = $.fn.zTree.init($("#treeDemo"), settingss, zNodes); //初始化树
						zTreeObj.expandAll(true);    //true 节点全部展开、false节点收缩
						/*$("#reportManagerDiv").html("");
						tree = new dhtmlXTreeObject("reportManagerDiv", "100%",
								"100%", 0);
						tree.enableTreeLines(true);
						tree.enableCheckBoxes(false);
						tree.setImagePath("img/dhx/dhxtree_web/");
						tree.attachEvent("onClick", onNodeSelect);//绑定点击事件
						tree.insertNewItem(0, -1, "计量支付报表", 0, "部门.png", "部门.png",
								"部门.png", "CHILD");
						for (var i = 0; i < result.data.length; i++) {
							tree.insertNewItem(-1, result.data[i].rpId,
									result.data[i].reportName, 0, "部门.png",
									"部门.png", "部门.png", "CHILD");
							tree.setUserData(result.data[i].rpId,
									result.data[i].reportName,
									result.data[i].queryModeType);
						}*/
					}
				}
			});
		}

        //监听汇总按钮点击事件
        $("#dataCollectBtn").on("click", function () {
            $("#dataCollentSpan").text("数据汇总中...");
            isDateCollectVal = 0;
            $.ajax({
                url: "dataGather/data_collect",
                data: {},
                dataType: "json",
                success: function (result) {
                    if (result.code == 1) {
                        isDateCollectVal = 1;
                        $("#dataCollentSpan").text("数据汇总完成");
                        Ewin.msg({
                            type: "success",
                            content: "操作成功！"
                        });
                    }else if (result.code == 0){
                    	Ewin.msg({
                            type: "danger",
                            content: result.msg
                        });
                    }
                }
            });
        });
        //监听刷新按钮点击事件
        $("#refreshBtn").on("click", function () {
        	$.ajax({
                url: "dataGather/data_refresh_gather",
                data: {},
                dataType: "json",
                success: function (result) {
                    if (result.code == 1) {
                        isDateCollectVal = 1;
                       // $("#dataCollentSpan").text("刷新完成");
                        Ewin.msg({
                            type: "success",
                            content: "刷新完成！"
                        });
                    }else if (result.code == 0){
                    	Ewin.msg({
                            type: "danger",
                            content: result.msg
                        });
                    }
                }
            });
        });
        /**选择章节下拉框的监听事件*/
        $(".reportSelect").on("change", function () {
            //选择章节之后重新加载iframe报表
            var chapterSelVal = $("#chapterSel").val();
            var measureSelVal = $("#measureSel").val();
            var varyConSelVal = $("#varyConSel").val();
            var url = iframeUrl + "&chapterType=" + chapterSelVal
                + "&measureType=" + measureSelVal + "&varyConType="
                + varyConSelVal;
            PDFObject.embed(url, "#reportManagerIframeView");
        })
    });
</script>
</body>
</html>

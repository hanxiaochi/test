<div style="background:#ffffff;padding:10px;"> 
	<div class="layui-form" >
			<div class="layui-form-item" >
					    <div class="layui-inline" style="margin-top:15px;">
						    <div class="layui-input-inline"style="width:300px" >
						      <input type="text" style="width:300px" name="search"  placeholder="请输入"  class="layui-input">
						    </div>
					    	<button class="layui-btn layui-btn-primary layui-btn-sm" lay-submit lay-filter="syInformationTableSearch">搜索</button>
					    </div>
	 		</div>
	</div>
<table id="syInformationTable"  lay-filter="syInformationTable"></table>
</div>
<script type="text/html" id="syInformationTableToolBar">
	<button class="btn btn-primary btn-sm" lay-event="add"><i class="glyphicon glyphicon-plus"></i> 添加资料</button>
	<button class="btn btn-primary btn-sm" lay-event="addTestHouse"><i class="glyphicon glyphicon-plus"></i> 试验室</button>
</script>
<script type="text/html" id="syInformationTableBar">
	{{#  if(d.isUser>0){ }}
	<a title="编辑 " lay-event="edit"  class="btn btn-primary btn-xs">编辑</a>
	<a title="删除 " lay-event="del"  class="btn btn-danger btn-xs">删除</a>
	{{#  }else{ }}
	<a title="查看 " lay-event="see"  class="btn btn-primary btn-xs">查看</a>
	{{#  } }}
</script>
<script type="text/javascript">
var modelIndexCurr=0;
layui.use(['table'],function() {
	layer.load(2);
	//表格
	var table = layui.table;
	var form = layui.form;
	/**计量支付主表 数据加载*/
	var cols = [
        {"title": "试验室","field":"testHouseName"},
        {"title": "试验类型","field":"testName"},
        {"title": "创建时间","field":"createTime"},
        {"title": "备注","field":"remark"},
        {"title": "操作","align": "center","fixed":"right", toolbar: '#syInformationTableBar',width:120}
    ];
	table.render({
		    elem: '#syInformationTable'
		    ,url: 'syzl/list' //数据接口
		  	,page: true
		  	,cellMinWidth: 80
		  	,height: 'full-250'
		  	,toolbar: '#syInformationTableToolBar'
		  	,defaultToolbar:[]
		  	,even:true
		  	,limit:30
		    ,cols: [cols]
		    ,size: 'sm'
		    ,done : function() {
				layer.closeAll('loading');
			}
	});
	var topBtn={
			add:function(){
				$.ajax({
					url:"syzl/edit_page",
					type:"get",
					success:function(result){
						modelIndexCurr=layer.open({
							  type: 1,
							  title:"添加",
							  skin: 'layui-layer-rim', //加上边框
							  area: ['500px', '490px'], //宽高
							  content: result
						});
					}
				});
			},
			addTestHouse:function(){
				$.ajax({
					url:"syzl/h_page",
					type:"get",
					success:function(result){
						modelIndexCurr=layer.open({
							  type: 1,
							  title:"试验室",
							  skin: 'layui-layer-rim', //加上边框
							  area: ['500px', '490px'], //宽高
							  content: result
						});
					}
				});
			}
	}
	var opBtn={
			edit:function(data){
				$.ajax({
					url:"syzl/edit_page",
					data:{id:data.id},
					type:"get",
					success:function(result){
						modelIndexCurr=layer.open({
							  type: 1,
							  title:"编辑",
							  skin: 'layui-layer-rim', //加上边框
							  area: ['500px', '550px'], //宽高
							  content: result
						});
					}
				});
			},
			see:function(data){
				$.ajax({
					url:"syzl/see_page",
					data:{id:data.id},
					type:"get",
					success:function(result){
						modelIndexCurr=layer.open({
							  type: 1,
							  title:"编辑",
							  skin: 'layui-layer-rim', //加上边框
							  area: ['500px', '550px'], //宽高
							  content: result
						});
					}
				});
			},
			del:function(data){
				layer.confirm('是否删除当前数据？', {
						title:'提示',
					  btn: ['确定','取消'] //按钮
					}, function(){
						$.ajax({
							url:"syzl/del",
							data:{id:data.id},
							type:"post",
							success:function(res){
								layer.msg("删除"+res.msg);
								table.reload("syInformationTable");
							}
						});
					}, function(){
					});
				
			}
	}
	//监听操作栏按钮
	table.on('tool(syInformationTable)', function(obj){
		opBtn[obj.event](obj.data);
	});
	//监听头部按钮
	table.on('toolbar(syInformationTable)', function(obj){
		topBtn[obj.event]();
	});
	form.on('submit(syInformationTableSearch)', function(data){
		table.reload("syInformationTable", {where:data.field});
		return false;
	});
});
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>材料列表信息</title>
</head>
<body>
	<div id="workingPositionDiv"></div>
	<!-- 引入工作位置 -->
	<div class="box">
		<table id="manualModelTable" lay-filter="manualModelTable" class="table table-striped table-bordered" width="100%">
		</table>
	</div>
	<script type="text/html" id="manualModelToolBar">
		<button  class="btn btn-primary btn-sm"  lay-event="addmanualModel" id="addmanualModel"><i class="glyphicon glyphicon-plus"></i> 添加数据</button>
	</script>
	<script type="text/javascript">
	/*初始化tab*/
	layui.use(['table'],function() {
		manualModelTable = layui.table;
		manualModelTable.render({
			elem: '#manualModelTable',
			toolbar : "#manualModelToolBar", //开启工具栏，此处显示默认图标，可以自定义模板，详见文档
			defaultToolbar:[],
			url: 'manual_model/find_manual_model_page', //数据接口
			where: {
			},
			method: "get",
			page: true,
			even:true,
			limit: 10,
			limits:[10,20,30],
			height:'full-160',
			cols: [ [{
				"title": "材料编号",
				"field": "materialNo",
				align: 'center',
				"width":150
			},
			{

				"title": "材料名称",
				"field": "materialName",
				align: 'center'
			},
			{
				"title": "规格型号",
				"field": "specType",
				align: 'center',
			},
			{
				"title": "测量单位",
				align: 'center',
				"field": "measureUnit"
			},
			{
				"title": "操作",
				width: 180,
				align: 'center',
				"fixed": "right",
				templet: function(d) {
					var id = d.materialId;
					var butHtml='';
						butHtml += '<button title="编辑"  lay-event="edit" class="btn btn-primary btn-xs">编辑</button>';
						butHtml += '<button title="删除" lay-event="remove" class="btn btn-danger btn-xs">删除</button>';
					return butHtml;
				}
			}
			] ],
			size: 'sm',
			done: function() {
			}
		});
		manualModelTable.on('tool(manualModelTable)',
			function(obj) {
				var data = obj.data;
				var materialId = data.materialId;
				switch(obj.event) {
					case 'edit':
						Ewin.modal({
							modalId : "materialAddEditModel",
							title : "修改材料",
							width : 450,
							url : "manual_model/edit_manual_model_add_page",
							data : {
								materialId : materialId,
								type : "edit"
							},
			 				drag:true
						});
						break;
					case 'remove':
						Ewin.confirm({
							message: "确认要删除选中的数据吗？"
						}).on(function(e) {
								if(e) {
									$.ajax({
											url: "manual_model/del_MaterialModel",
											data: {
												"materialId": materialId
											},
											dataType: "json",
											type: "post",
											success: function(
												result) {
												if(result.code == 1) {
													Ewin.msg({
														type: "success",
														content: "删除成功"
													});
													manualModelTable.reload('manualModelTable', {});
												} else {
													Ewin.msg({
														type: "danger",
														content: "删除失败"
													})
												}
											}
										});
								}
							})
					break;
				};
			})
			manualModelTable.on('toolbar(manualModelTable)', function(obj){
				manualModelTableToolClick[obj.event]();
			});
			
			var manualModelTableToolClick={
				addmanualModel:function(){
					Ewin.modal({
						modalId : "materialAddEditModel",
						title : "添加材料",
						width : 450,
						url : "manual_model/edit_manual_model_add_page",
						data : {
						},
		 				drag:true
					});
				}
			}
	})
	</script>
</body>
</html>

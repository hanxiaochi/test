	<script type="text/javascript">
	layui.use(['table','form','upload'],function() {
		var projectIdWorkSpace = $("#sysProjectWorkPositionSel").val();
		var pageNum = 1;
		var msg = "";
		if(msg!=""){
			layer.msg(msg, {icon: 5,offset: '200px' });
		}
		layer.load(2);
		/*初始化tab*/
		$("#measureTab").html($("#indexTabContent").html());
		//表格
		var table = layui.table,form = layui.form,upload = layui.upload;
		form.render();
		form.on('select(select)', function(data){
			//var typeCode =""; 
			table.reload("billMeasureTable", {where:{
				typeCode:"",
				flag:data.value
			}});
	    })
		form.on('submit(billMeasureSearch)', function(data){
			  var arrData = {};
			  arrData["bm1.certify_no"]=data.field.search;
			  arrData["bm1.comment"]=data.field.search;
			  arrData["bm1.draw_no"]=data.field.search;
			  arrData["ban.node_name"]=data.field.search;
			  arrData["bm1.measure_no"]=data.field.search;
			  arrData["bm1.peg_no"]=data.field.search;
			  arrData["bm1.position"]=data.field.search;
			  arrData["bbm.bill_name"]=data.field.search;
			  arrData["bbm.bill_no"]=data.field.search;
			  arrData["bbm.measure_unit"]=data.field.search;
			  arrData["sb.page_no"]=data.field.search;
			  table.reload("billMeasureTable",{where:{searchs:JSON.stringify(arrData)}})
			  return false; //阻止表单跳转。如果需要表单跳转，去掉这段即可。
		});
		$("#billMeasureSearchCoulm").on("click",function(){
			layer.tips('筛选项：图号，桩号，交工证书，部位，计量编号，分项名称，清单编号，清单名称，清单单位', '#billMeasureSearchCoulm', {
				  tips: [3, '#3595CC'],
				  time: 4000
			});
		})
		/**计量支付主表 数据加载 */
		var cols = [
			{"type":"checkbox"},
          	{"title": "计量单号","field":"measureNo",sort: true,width:130,event : "measureNo","style":"text-align:left","align":"center"},
            {"title": "图号","field":"drawNo",event : "measureNo","style":"text-align:left","align":"center"},
            {"title": "桩号","field":"pegNo",event : "measureNo","style":"text-align:left","align":"center"},
            {"title": "交工证书","field":"certifyNo",event : "measureNo","style":"text-align:left","align":"center"},
            {"title": "部位","field":"position",event : "measureNo","style":"text-align:left","align":"center"},
            {"title": "计量日期","align": "center","field":"measureDate",minWidth:125,event : "measureNo"},
            {"title": "状态","align": "center","field":"states",minWidth:150,event : "measureNo",templet:function(d){
            	return "<p data-processInstanceId='"+d.processInstanceId+"'>"+d.states+"</p>"
            }},
            {"title": "操作","align": "center","fixed":"right", toolbar: '#billMeasureTableBar',minWidth:240}
        ];
		if(false){
			cols = [
				{"type":"checkbox"},
	          	{"title": "计量单号","field":"measureNo",sort: true,width:130,event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "图号","field":"drawNo",event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "桩号","field":"pegNo",event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "质检单编号","field":"certifyNo",event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "部位","field":"position",event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "计量日期","align": "center","field":"measureDate",minWidth:125,event : "measureNo"},
	            {"title": "状态","align": "center","field":"states",minWidth:150,event : "measureNo",templet:function(d){
	            	if(0=="1"){
	            		if(d.lineColor!=""){
	            			return "<p style='color:"+d.lineColor+"' data-processInstanceId='"+d.processInstanceId+"'>"+d.states+"</p>"
	            		}
	            	}
	            	return "<p data-processInstanceId='"+d.processInstanceId+"'>"+d.states+"</p>"
	            }},
	            {"title": "操作","align": "center","fixed":"right", toolbar: '#billMeasureTableBar',minWidth:240}
	        ];
        }
		if("0"==1){
			cols = [
				{"type":"checkbox"},
	          	{"title": "计量单号","field":"measureNo",sort: true,width:130,event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "图号","field":"drawNo",event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "桩号","field":"pegNo",event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "交工证书","field":"certifyNo",event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "部位","field":"position",event : "measureNo","style":"text-align:left","align":"center"},
	            {"title": "计量日期","align": "center","field":"measureDate",minWidth:125,event : "measureNo"},
	            {"title": "所属工区","field":"workAreaName",event : "measureNo","align": "center",templet: function(d){
					return d.workAreaName;
	     	    }},
	            {"title": "状态","align": "center","field":"states",minWidth:150,event : "measureNo",templet:function(d){
	            	if(0=="1"){
	            		if(d.lineColor!=""){
	            			return "<p style='color:"+d.lineColor+"' data-processInstanceId='"+d.processInstanceId+"'>"+d.states+"</p>"
	            		}
	            	}
	            	return "<p data-processInstanceId='"+d.processInstanceId+"'>"+d.states+"</p>"
	            }},
	            {"title": "操作","align": "center","fixed":"right", toolbar: '#billMeasureTableBar',minWidth:240}
	        ];
		}
		table.render({
			    elem: '#billMeasureTable'
			    ,url: 'bill_measure/list?typeCode=' //数据接口
			  	,toolbar: '#billMeasureTableToolBar'
				,defaultToolbar:[]
			  	,height: '490'
			  	,even:true
			  	,page: {
					limit: 10,
			  		curr: 1
			  	}
				,where: {
					sorts:function(){
						var type = localStorage.getItem("billMeasureTableMeasureNoSort");
						if(type && (type=="desc"||type=="asc")){
							return " order by bm1.measure_no "+type;
						}
						return " order by bm1.measure_no desc";
					}
				}
			    ,cols: [cols]
			    ,size: 'sm'
			    ,done : function(res, curr, count) {
			    	pageNum = curr;
					layer.closeAll('loading');
					$("#billMeasureDetailTableDiv").empty();
					//点击状态触发流程图显示
					$('p[data-processInstanceId]').on('click', function (e) {
						$("#showProcessImg .modal-content>img").attr("src","workflow/see_process_img?processInstanceId="+$(this).attr("data-processInstanceId")+"&dfd="+new Date().getMilliseconds());
						$("#showProcessImg").modal();
					});
				}
		});
		//触发排序事件
		table.on('sort(billMeasureTable)', function(obj){ //注：sort 是工具条事件名，test 是 table 原始容器的属性 lay-filter="对应的值"
			console.log(obj.field); //当前排序的字段名
			console.log(obj.type); //当前排序类型：desc（降序）、asc（升序）、null（空对象，默认排序）
			console.log(this); //当前排序的 th 对象
			var sortStr = obj.type==null?"desc":obj.type;
			localStorage.setItem("billMeasureTableMeasureNoSort", sortStr);
			//尽管我们的 table 自带排序功能，但并没有请求服务端。
			//有些时候，你可能需要根据当前排序的字段，重新向服务端发送请求，从而实现服务端排序，如：

			table.reload('billMeasureTable', {
				initSort: obj //记录初始排序，如果不设的话，将无法标记表头的排序状态。
				,where: { //请求参数（注意：这里面的参数可任意定义，并非下面固定的格式）
					sorts: " order by bm1.measure_no "+sortStr
				}
			});
		});
		//监听操作栏按钮
		table.on('tool(billMeasureTable)', function(obj){
			var data = obj.data;
			$("#billMeasureDetailTableDiv").empty();
			billMeasureTableLineClick[obj.event](data.billMeasureId,obj);
		});
		//监听头部按钮
		table.on('toolbar(billMeasureTable)', function(obj){
			if($("#sysGatherDataWorkPositionSel>option").length==0 || $("#select2-sysGatherDataWorkPositionSel-container").attr("title")=="请选择工期"){
				Ewin.msg({type:"danger",content:"请选择工作位置！"})
				return false;
			}
			var checkStatus = table.checkStatus(obj.config.id),data = checkStatus.data;
			billMeasureTableToolClick[obj.event](data);
		});
		// 双击行进入 -- 编辑
		/*table.on('rowDouble(billMeasureTable)', function(obj){
		      var data = obj.data;
		      obj.tr.addClass('layui-table-click').siblings().removeClass('layui-table-click');
		      billMeasureTableLineClick["editBtn"](data.billMeasureId);
		});*/
		//单击行进入  -- 显示细目
		table.on('row(billMeasureTable)', function(obj){
// 			  var t = $(event.target).attr("lay-event");//点击操作按钮时不触发细目表
// 			  if(typeof(t)!="undefined"){
// 					return false;
// 			  }
// 		      var data = obj.data;
// // 		      obj.tr.addClass('layui-table-click').siblings().removeClass('layui-table-click');
// 			  var billMeasureId = data.billMeasureId;
// 			  $("#billMeasureDetailTableDiv").load("bill_measure/detail_page?billMeasureId="+billMeasureId);
		});
		 
		table.on('checkbox(billMeasureTable)', function(obj){
			if(obj.type!='all'){
				if(obj.checked){
					 obj.tr.addClass('layui-table-click'); 	
				}else{
					 obj.tr.removeClass('layui-table-click'); 	
				}
			}else{
				if(obj.checked){
					 $("div[class='layui-unselect layui-form-checkbox layui-form-checked']").attr('class','layui-unselect layui-form-checkbox layui-form-checked');
					$("div[lay-id='billMeasureTable'] div[class='layui-table-fixed layui-table-fixed-l'] tr").addClass('layui-table-click ');
					$("div[lay-id='billMeasureTable'] div[class='layui-table-body layui-table-main'] tr").addClass('layui-table-click ');
				}else{
					 $("div[class='layui-unselect layui-form-checkbox layui-form-checked']").attr('class','layui-unselect layui-form-checkbox');
					$("div[lay-id='billMeasureTable'] div[class='layui-table-fixed layui-table-fixed-l'] tr").removeClass('layui-table-click ');
					$("div[lay-id='billMeasureTable'] div[class='layui-table-body layui-table-main'] tr").removeClass('layui-table-click ');
				}
			}
		})
		//表格行的点击
		var billMeasureTableLineClick={
				trackBtn:function(billMeasureId,obj){//追踪
					Ewin.modal({
						title : "追踪清单",
						modalId : "trackBillMeasureList",
						width : 650,
						high :600,
						url : "bill_measure/track_bill_measure_page",
						data : {
							"billMeasureId" : billMeasureId
						},
						headerClass:"zw-track-header",
						btn:"hide",
					});
				},
				measureNo:function(billMeasureId,obj){
					 $("div[lay-id='billMeasureTable'] input[type='checkbox']").prop('checked',false);
					 $("div[class='layui-unselect layui-form-checkbox layui-form-checked']").attr('class','layui-unselect layui-form-checkbox');
					 
					$(obj.tr).find("td:first").children().find("div:first").addClass("layui-form-checked");
					var index=$(obj.tr).attr("data-index");
					var data=table.cache["billMeasureTable"];
					for(var i=0;i<data.length;i++){
						data[i]['LAY_CHECKED']='';
						if(index==i){
							data[i]['LAY_CHECKED']='True';
						}
					}
				      var billMeasure = obj.data;
					  var billMeasureId = billMeasure.billMeasureId;
					  $("#billMeasureDetailTableDiv").load("bill_measure/detail_page?billMeasureId="+billMeasureId);
				},
				agreeBtn:function(billMeasureId,obj){//同意
					Ewin.confirm({ message: "确定同意此条清单？" }).on(function (e) {
						if (e) {//e 为true 说明点击确定
							$.ajax({
								url:"bill_measure/agree_order",
								type:"post",
								data:{"billMeasureId":billMeasureId,"comment":"同意"},
								dataType:"json",
								success:function(result){
									if(result.code==1){
										Ewin.msg({type:"success",content:"审核通过！"})
										table.reload("billMeasureTable");
									}else{
										Ewin.msg({type:"danger",content:result.msg})
									}
								}
							});
						}
					});
				},
				auditingBtn:function(billMeasureId,obj){//审核按钮
					$.ajax({
						url : "bill_measure/edit_page",
						type : "get",
						async : false,
						data : {
							billMeasureId : billMeasureId,
							btnType : "auditingBtn",
							pageNum: pageNum
						},
						success : function(result) {
							$("#measureTab").html(result);
						}
					});
				},
				editBtn : function(billMeasureId, obj){//编辑
									$.ajax({
										url : "bill_measure/edit_page",
										type : "get",
										async : false,
										data : {
											billMeasureId : billMeasureId,
											btnType : "editBtn",
											other: 0,
											pageNum: pageNum
										},
										success : function(result) {
											$("#measureTab").html(result);
										}
									});
								},
								superEditBtn : function(billMeasureId, obj){//编辑
									$.ajax({
										url : "bill_measure/edit_page",
										type : "get",
										async : false,
										data : {
											billMeasureId : billMeasureId,
											btnType : "superEditBtn",
											other: 0,
											pageNum: pageNum
										},
										success : function(result) {
											$("#measureTab").html(result);
										}
									});
								},
								see : function(billMeasureId, obj) {//查看
									$.ajax({
										url : "bill_measure/edit_page",
										type : "get",
										async : false,
										data : {
											billMeasureId : billMeasureId,
											btnType : "seeBtn",
											pageNum : pageNum
										},
										success : function(result) {
											$("#measureTab").html(result);
										}
									});
								},
								returnBtn : function(billMeasureId, obj) {//退回
									Ewin.modal({
										modalId : "returnOrderPageList",
										title : "退回",
										width : 300,
										headerClass : "zw-track-header",
										submitText : "确认退回",
										url : "bill_measure/return_order_page",
										data : {
											"billMeasureId" : billMeasureId,
											"tableId" : "billMeasureTable"
										}
									});
								},
								deleteBtn : function(billMeasureId, obj) {//删除
									Ewin.confirm({message : "确认要删除选择的数据吗？"}).on(
													function(e) {
														if (e) {//e 为true 说明点击确定
															$
																	.ajax({
																		url : "bill_measure/delete/"
																				+ billMeasureId,
																		type : "delete",
																		dataType : "json",
																		success : function(
																				result) {
																			if (result.code == 1) {
																				Ewin.msg({
																							type : "success",
																							content : "已删除"
																						});
																				table.reload("billMeasureTable");
																			} else {
																				Ewin.msg({
																							type : "danger",
																							content : result.msg
																						});
																			}
																		}
																	});
															return;
														}
													});
								},
								measureBtn : function(billMeasureId, obj) {//计量
									$.ajax({
												url : "bill_measure/check_detail_count",
												type : "get",
												data : {
													billMeasureId : billMeasureId
												},
												dataType : "json",
												success : function(result) {
													if (result.code == 1) {
														Ewin.msg({
																	type : "success",
																	content : result.msg
																});
																$.ajax({
																	url : "bill_measure/add_measure_page",
																	type : "get",
																	async : false,
																	data : {
																		billMeasureId : billMeasureId,
																		btnType : "measureTab",
																		pageNum: pageNum
																	},
																	success : function(result) {
																		$("#measureTab").html(result);
																	}
																});
													} else {
														Ewin
																.msg({
																	type : "danger",
																	content : result.msg
																});
													}
												}
											});

									} else {
										var arr = new Array();
										for (var i = 0; i < data.length; i++) {
											arr.push(data[i].billMeasureId);
										}
										Ewin.modal({
											title : "复制清单",
											modalId : "copyBillMeasure",
											width : 550,
											url : "bill_measure/copy_page",
											data : {
												"billMeasureIds" : arr
														.join(",")
											},
											headerClass : "zw-track-header",
											btn : "hide",
											drag : true
										});
									}
								},
								orderMeasureNo : function(data) {//计量单排序
									Ewin
											.confirm({
												message : "确定将本期计量单重新排序吗？"
											})
											.on(
													function(e) {
														if (e) {
															$
																	.ajax({
																		url : "bill_measure/order_measure_no",
																		type : "post",
																		dataType : "json",
																		success : function(
																				result) {
																			if (result.code == 1) {
																				Ewin
																						.msg({
																							type : "success",
																							content : "排序完成！"
																						})
																				table
																						.reload("billMeasureTable");
																			} else {
																				Ewin
																						.msg({
																							type : "danger",
																							content : result.msg
																						})
																			}
																		}
																	});
														}
													});
								},
								reportView : function(data) {//预览报表
									if (data.length == 0) {
										Ewin.msg({
											type : "warning",
											content : "请选择一条清单！"
										});
										return false;
									} else if (data.length > 1) {
										Ewin.msg({
											type : "warning",
											content : "只能预览一条清单！"
										});
										return false;
									}
									Ewin.modal({
												title : "预览计量单",
												modalId : "reportViewModalId",
												url : "reportManager/reportPreviewSecond",
												data : {
													"reportCode" : "report_bill_measure",
													id : data[0].billMeasureId
												},
												headerClass : "zw-track-header",
												btn : "hide",
												height : 600,
												width : 850,
												drag : false
											});
								},
								archiveMeasureNo : function(data) {//计量单归档
									var message = "确认要归档选择的清单吗?";
									var billMeasureIds = "*";
									if (data.length == 0) {
										message = "确认要全部归档吗?";
									} else {
										var arr = new Array();
										for (var i = 0; i < data.length; i++) {
											arr.push(data[i].billMeasureId);
										}
										billMeasureIds = arr.join(",");
									}
									Ewin
											.confirm({
												message : message
											})
											.on(
													function(e) {
														if (e) {//e 为true 说明点击确定
															$
																	.ajax({
																		url : "bill_measure/archive_measure",
																		type : "post",
																		data : {
																			"billMeasureIds" : billMeasureIds
																		},
																		dataType : "json",
																		success : function(
																				result) {
																			if (result.code == 1) {
																				Ewin
																						.msg({
																							type : "success",
																							content : "归档完成！"
																						})
																				table
																						.reload("billMeasureTable");
																			} else {
																				Ewin
																						.msg({
																							type : "danger",
																							content : result.msg
																						})
																			}
																		}
																	});
														}
													});
								}
							}
						});
	</script>
</body>
</html>

	<script type="text/javascript">
		layui.use([ 'layer' ], function() {
			var layer = layui.layer;
			var msg = "";
			if(msg!=""){
				layer.msg(msg, {icon: 5,offset: '200px' });
			}
		})
		$.ajax({
					url : "contract_survey/find_other_mation",
					dataType : "json",
					type : "post",
					data : {},
					success : function(result) {
						var data = result.data;
						if (result.code == 1) {
							if (data.length != 0) {
								for (var i = 0; i < data.length; i++) {
									var panelHtml = "";
									panelHtml += '<span><div class="input-group">';
									panelHtml += '<div class="input-group-addon" id="input-group-addons">'+ data[i].mationName +'：</div>';
									panelHtml += '<input type="text" class="form-control"';
									panelHtml += 'value="'+data[i].mationValue+'">';
									panelHtml += '</div></span>';
									$("#othersB").append(panelHtml);
								}
							}
						} else {
							Ewin.msg({
								type : "danger",
								content : result.msg
							});

						}
					}
				});
	</script>
